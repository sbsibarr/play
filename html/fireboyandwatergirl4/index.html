<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireboy And Watergirl 4: The Crystal Temple</title>
    <style>
      /* Clean background and remove margins */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        overflow: hidden;
      }

      /* Center the game and keep it locked to its original 4:3
         aspect ratio. The surrounding black area letterboxes the
         viewport so no sprites clip off the edge. */
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      ruffle-player {
        display: block;
        aspect-ratio: 4 / 3;
        height: 100%;
      }
      /* When the viewport is taller than 4:3, fit by width instead. */
      @media (max-aspect-ratio: 4 / 3) {
        ruffle-player {
          height: auto;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- The game will render inside this div -->
    <div id="root"></div>

    <!-- 1. This loads Ruffle from the official CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <!-- 2. This is the exact script they use to scale and center the game -->
    <script>
      function embedSWF(url, cont) {
        let ruffle = window.RufflePlayer.newest(),
          player = Object.assign(
            document.getElementById(cont).appendChild(ruffle.createPlayer()),
            {
              /* Sizing is handled by the CSS above (locked to 4:3). */
              style: "display: block;",
            }
          );

        player.load({ url });
      }

      // Tell the page to load your game file
      embedSWF("fireboyandwatergirl4.swf", "root");
    </script>
  </body>
</html>
