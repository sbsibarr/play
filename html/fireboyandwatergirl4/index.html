<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireboy And Watergirl 4: The Crystal Temple</title>
    <style>
      /* Clean background and remove margins */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- The game will render inside this div -->
    <div id="root"></div>

    <!-- 1. This loads Ruffle from the official CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <!-- 2. This is the exact script they use to scale and center the game -->
    <script>
      function embedSWF(url, cont) {
        let ruffle = window.RufflePlayer.newest(),
          player = Object.assign(
            document.getElementById(cont).appendChild(ruffle.createPlayer()),
            {
              style:
                "width: 100%; height: 100%; position: absolute; top: 0; left: 0;",
            }
          );

        player.load({ url });
      }

      // Tell the page to load your game file
      embedSWF("fireboyandwatergirl4.swf", "root");
    </script>
  </body>
</html>
