<!DOCTYPE html>
<html>
<head>
  <title>Fireboy And Watergirl</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
    /* Forces Ruffle to take up the full screen space */
    embed, object, ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
  <script>
    // Tell Ruffle how to scale the game before loading
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "letterbox": "on",       /* Centers the game and adds black bars automatically */
      "scale": "showAll",      /* Shows the entire game on the screen */
      "forceScale": true,      /* Forces the game to fit your screen size */
      "quality": "high"        /* Keeps the graphics sharp */
    };
  </script>
  <!-- Load the official, verified Ruffle player -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="game-container">
    <embed src="fireboyandwatergirl.swf"></embed>
  </div>
</body>
</html>
