<!DOCTYPE html>
<html>
<head>
  <title>Fireboy And Watergirl</title>
  <style>
    body { 
      margin: 0; 
      background: black; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    /* This container forces the game to keep its shape */
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    embed {
      width: 100%;
      height: 100%;
      aspect-ratio: 4 / 3; 
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ruffle/0.1.0/ruffle.js"></script>
</head>
<body>
  <div id="game-container">
    <embed src="fireboyandwatergirl.swf"></embed>
  </div>
</body>
</html>
